{% extends 'admin_panel/base_admin.html' %}
{% block title %}Add Doctor{% endblock %}
{% block breadcrumb %}Home / Doctors / Add{% endblock %}
{% block content %}
<div class="section">
    <div class="section-header"><h2>Add New Doctor</h2></div>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <div class="form-container">
        <form method="POST" class="settings-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-input" required>
            </div>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-input" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="nic">NIC</label>
                    <input type="text" id="nic" name="nic" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" class="form-input" required>
                </div>
            </div>
            <div class="form-group">
                <label for="specialty">Specialty</label>
                <select id="specialty" name="specialty" class="form-input" required>
                    <option value="">Select Specialty</option>
                    {% for s in specialties %}<option value="{{ s.id }}">{{ s.sname }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-input" required>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add Doctor</button>
                <a href="/admin-panel/doctors/" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
