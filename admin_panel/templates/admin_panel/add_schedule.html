{% extends 'admin_panel/base_admin.html' %}
{% block title %}Add Session{% endblock %}
{% block breadcrumb %}Home / Sessions / Add{% endblock %}
{% block content %}
<div class="section">
    <div class="section-header"><h2>Add New Session</h2></div>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <div class="form-container">
        <form method="POST" class="settings-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="doctor">Doctor</label>
                <select id="doctor" name="doctor" class="form-input" required>
                    <option value="">Select Doctor</option>
                    {% for doc in doctors %}<option value="{{ doc.docid }}">{{ doc.docname }} - {{ doc.specialties.sname }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="title">Session Title</label>
                <input type="text" id="title" name="title" class="form-input" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="scheduledate">Date</label>
                    <input type="date" id="scheduledate" name="scheduledate" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="scheduletime">Time</label>
                    <input type="time" id="scheduletime" name="scheduletime" class="form-input" required>
                </div>
            </div>
            <div class="form-group">
                <label for="nop">Number of Slots</label>
                <input type="number" id="nop" name="nop" min="1" class="form-input" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add Session</button>
                <a href="/admin-panel/schedule/" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
