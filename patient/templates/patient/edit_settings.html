{% extends 'patient/base_patient.html' %}

{% block title %}Edit Settings{% endblock %}

{% block breadcrumb %}Home / Settings / Edit{% endblock %}

{% block content %}
<div class="section">
    <div class="section-header">
        <h2>Edit Account Information</h2>
    </div>

    <div class="form-container">
        <form method="POST" action="/patient/settings/edit/" class="settings-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="pname">Full Name</label>
                <input type="text" id="pname" name="pname" value="{{ patient.pname }}" class="form-input" required>
            </div>

            <div class="form-group">
                <label for="paddress">Address</label>
                <input type="text" id="paddress" name="paddress" value="{{ patient.paddress }}" class="form-input" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="pnic">NIC Number</label>
                    <input type="text" id="pnic" name="pnic" value="{{ patient.pnic }}" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="ptel">Phone Number</label>
                    <input type="tel" id="ptel" name="ptel" value="{{ patient.ptel }}" class="form-input" required>
                </div>
            </div>

            <div class="form-group">
                <label for="pdob">Date of Birth</label>
                <input type="date" id="pdob" name="pdob" value="{{ patient.pdob|date:'Y-m-d' }}" class="form-input" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="/patient/settings/" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
